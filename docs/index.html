<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden Service</title>
<!-- Wird von scripts/start-onion.ps1 automatisch mit deiner .onion-Adresse befüllt. -->
<meta http-equiv="onion-location" content="http://lvwzim3wuiqtlziawv36xsnfjfbo3rrezypl366fpsy65besnyddg6ad.onion/">
<style>
  :root { --bg: #07060b; --text: #cfc9e2; --onion: #a566d6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 0%, #1b1030 0%, transparent 65%), var(--bg);
    color: var(--text);
    font: 16px/1.6 "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  h1 {
    margin: 0; font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700;
    letter-spacing: .04em; color: #fff; text-shadow: 0 0 18px rgba(165,102,214,.55);
  }
  #enter { margin-top: 32px; }
  #enter a {
    display: inline-block; padding: 10px 28px; color: var(--text); text-decoration: none;
    border: 1px solid var(--onion); transition: background .15s, box-shadow .15s;
  }
  #enter a:hover { background: rgba(165,102,214,.15); box-shadow: 0 0 14px rgba(165,102,214,.4); }
  #enter a:focus-visible { outline: 2px solid var(--onion); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Hidden Service</h1>
  <div id="enter"></div>
</main>
<script>
  // Der Button erscheint nur im Tor-Netzwerk, im normalen Internet bleibt die Seite leer.
  if (location.hostname.slice(-6) === ".onion") {
    var a = document.createElement("a");
    a.href = "tutorial/index.html";
    a.textContent = "Enter site";
    document.getElementById("enter").appendChild(a);
  }
</script>
</body>
</html>
